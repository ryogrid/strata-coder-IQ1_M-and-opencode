name: CI
# Gates (AGENT.md): warning-free build, warning-free clippy INCLUDING
# test code, unit tests, and the tmux-driven e2e suite. Single job on
# purpose: e2e.sh shares the emu-e2e-* tmux session prefix, so no
# tmux-using suite may run concurrently (R-6).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    # Backstop for the PBT tmux step: proptest runs with timeout=0
    # (fork mode is incompatible with the tmux Drop guards, PBT design
    # 03 "Config plumbing"), so a hung case has no per-case kill;
    # this job timeout is the outer bound (05).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build (warning-free)
        run: RUSTFLAGS="-D warnings" cargo build --locked --all-targets
      - name: clippy (warning-free, incl. test code)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --locked
      - name: e2e suite (tmux, preinstalled on ubuntu runners)
        run: bash test-design/e2e.sh
      # PBT (test-design/pbt-design/05): steps are serial by
      # construction (one job), keeping the tmux non-concurrency law.
      # The debug emur exists from the build step above.
      - name: pbt-test build (warning-free)
        run: RUSTFLAGS="-D warnings" cargo build --locked -p pbt-test --all-targets
      - name: pbt-test clippy (warning-free)
        run: cargo clippy --locked -p pbt-test --all-targets -- -D warnings
      - name: P0 gap-buffer model (in-process)
        run: cargo test --locked -p pbt-test --test buffer_model
      - name: P1-P4 tmux fuzz (serialized)
        env:
          PBT_CASES: "8"
          # EMUR_BIN resolves against the TEST PROCESS CWD = pbt-test/
          # (cargo test runs the binary from its package dir), so the
          # path carries the leading ../ (gate B-1). Unset fallback in
          # support/mod.rs is CARGO_MANIFEST_DIR-relative = same place.
          EMUR_BIN: "../target/debug/emur"
        run: cargo test --locked -p pbt-test --test tmux_fuzz -- --test-threads=1
      # P5-P7 full-pane combination (test-design/pbt-design-combination/):
      # same tmux-serial law, same EMUR_BIN convention (04 §2).
      - name: P5-P7 full-pane combination (serialized)
        env:
          PBT_CASES: "8"
          EMUR_BIN: "../target/debug/emur"
        run: cargo test --locked -p pbt-test --test combination -- --test-threads=1
